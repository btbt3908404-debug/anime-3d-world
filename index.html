<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime 3D World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .ui {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 10;
      color: white;
      pointer-events: none;
    }

    .title {
      font-size: clamp(28px, 7vw, 58px);
      font-weight: 800;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #7dd3fc;
    }

    .subtitle {
      margin-top: 8px;
      color: #bae6fd;
      letter-spacing: 2px;
    }

    .hint {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,.35);
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="scene"></div>

<div class="ui">
  <div class="title">ANIME WORLD</div>
  <div class="subtitle">⚔️ THE MOON SWORDSMAN</div>
</div>

<div class="hint">
  🖱️ Move mouse / 📱 Move your finger
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050816);

scene.fog = new THREE.FogExp2(
  0x050816,
  0.025
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 3.5, 9);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document
  .getElementById("scene")
  .appendChild(renderer.domElement);


/* =========================
   CONTROLS
========================= */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 5;

controls.maxDistance = 15;

controls.target.set(0, 2, 0);


/* =========================
   LIGHTS
========================= */

const ambientLight =
  new THREE.AmbientLight(
    0x9bbcff,
    1.2
  );

scene.add(ambientLight);


const moonLight =
  new THREE.DirectionalLight(
    0xb9d8ff,
    3
  );

moonLight.position.set(
  -5,
  10,
  5
);

moonLight.castShadow = true;

scene.add(moonLight);


/* =========================
   MOON
========================= */

const moonGeometry =
  new THREE.SphereGeometry(
    2.2,
    64,
    64
  );

const moonMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xddeaff,
    emissive: 0x5577aa,
    emissiveIntensity: 1.5
  });

const moon =
  new THREE.Mesh(
    moonGeometry,
    moonMaterial
  );

moon.position.set(
  -5,
  7,
  -8
);

scene.add(moon);


/* Moon glow */

const glowGeometry =
  new THREE.SphereGeometry(
    2.8,
    32,
    32
  );

const glowMaterial =
  new THREE.MeshBasicMaterial({
    color: 0x77aaff,
    transparent: true,
    opacity: 0.12
  });

const moonGlow =
  new THREE.Mesh(
    glowGeometry,
    glowMaterial
  );

moonGlow.position.copy(
  moon.position
);

scene.add(moonGlow);


/* =========================
   GROUND
========================= */

const groundGeometry =
  new THREE.CircleGeometry(
    30,
    64
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x07111f,
    roughness: 0.9
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   MOUNTAINS
========================= */

for (let i = 0; i < 14; i++) {

  const height =
    2 + Math.random() * 5;

  const mountainGeometry =
    new THREE.ConeGeometry(
      2 + Math.random() * 2,
      height,
      6
    );

  const mountainMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x0b1626
    });

  const mountain =
    new THREE.Mesh(
      mountainGeometry,
      mountainMaterial
    );

  mountain.position.set(
    (Math.random() - 0.5) * 30,
    height / 2 - 0.2,
    -8 - Math.random() * 10
  );

  scene.add(mountain);
}


/* =========================
   STARS
========================= */

const starGeometry =
  new THREE.BufferGeometry();

const starCount = 1500;

const star
